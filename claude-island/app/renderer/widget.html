<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self' file:; style-src 'self' file:; font-src 'self' file: data:; img-src 'self' file: data:"
    />
    <title>Claude Island · Vault</title>
    <link rel="stylesheet" href="../node_modules/@fontsource/bricolage-grotesque/700.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/figtree/400.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/figtree/500.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/figtree/600.css" />
    <link rel="stylesheet" href="../node_modules/@fontsource/ibm-plex-mono/400.css" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="widget.css" />
  </head>
  <body>
    <section class="widget" id="widget" aria-label="Obsidian-Vault">
      <header class="w-head">
        <span class="w-gem" aria-hidden="true"></span>
        <div class="w-title">
          <span class="w-name" id="w-name">Vault</span>
          <span class="w-count" id="w-count"></span>
        </div>
        <button class="icon-btn" id="w-switch" type="button" title="Vault wechseln oder Ordner wählen">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 8h13l-3-3M20 16H7l3 3" /></svg>
        </button>
        <button class="icon-btn" id="w-close" type="button" title="Widget ausblenden">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 7l10 10M17 7L7 17" /></svg>
        </button>
      </header>

      <div class="w-mode" id="w-mode-row">
        <span class="w-label">Claude schreibt</span>
        <div class="seg" id="w-mode" role="group" aria-label="Schreibmodus">
          <button class="seg__btn" type="button" data-mode="ask" aria-pressed="true" title="Jede neue oder geänderte Notiz erscheint als Freigabe in der Insel">Fragen</button>
          <button class="seg__btn" type="button" data-mode="free" aria-pressed="false" title="Claude schreibt ohne Rückfrage">Frei</button>
        </div>
      </div>

      <label class="w-search" id="w-search">
        <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6" /><path d="M16 16l4 4" /></svg>
        <input class="w-input" id="w-q" type="search" placeholder="Im Vault suchen …" autocomplete="off" spellcheck="false" />
      </label>

      <div class="w-list" id="w-list"></div>
    </section>
    <script src="widget.js"></script>
  </body>
</html>
